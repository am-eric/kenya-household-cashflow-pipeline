# Single-container Airflow (scheduler + webserver + SQLite metadata) - enough for one DAG on one machine.
# Start:  cd airflow && docker compose up --build        UI: http://localhost:8080
# Admin password is printed in the logs on first start (user: admin).
services:
  airflow:
    build: .
    user: "${AIRFLOW_UID:-1000}:0"      # same uid as the host user, so files dbt writes into the repo stay yours
    command: standalone
    ports:
      - "8080:8080"
    env_file:
      - ../.env                         # PGUSER, PGPASSWORD, ... (the file is gitignored)
    environment:
      PGHOST: host.docker.internal      # Postgres runs on the host machine
      DBT_PROFILES_DIR: /opt/airflow/project/airflow
      KFD_PROJECT_DIR: /opt/airflow/project
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dags:/opt/airflow/dags
      - ..:/opt/airflow/project         # repo: data/raw, load_raw.py, kfd_dbt/, airflow/profiles.yml
      - airflow_home:/opt/airflow       # keeps run history between restarts
volumes:
  airflow_home:
