
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'kfd_dbt'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'kfd_dbt'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

vars:
  thin_week_min_rows: 10     # weeks with fewer rows are 'thin' and never flagged
  flag_k: 1.5                # flag when net < household mean - k * std dev
  min_ok_weeks: 8            # minimum usable weeks before a household baseline is trusted
  min_ok_days: 30            # minimum days with data before a household's daily baseline is trusted
  coping_window_days: 28     # look this far after a flagged week for coping activity

models:
  kfd_dbt:
    staging:
      +schema: staging
      +materialized: table
    clean:
      +schema: clean
      +materialized: table
    marts:
      +schema: marts
      +materialized: view

seeds:
  kfd_dbt:
    +schema: clean
    coping_types:
      +column_types:
        trx_type_code: text
